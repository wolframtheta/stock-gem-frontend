<div class="articles-container">
  <div class="header-section">
    <div class="header-content">
      <div class="header-top">
        <button class="btn-back" (click)="router.navigate(['/'])">
          <i class="pi pi-arrow-left"></i>
          Tornar
        </button>
      </div>
      <h1>
        <i class="pi pi-sparkles"></i>
        Els Teus Articles
      </h1>
      <p class="subtitle">Gestiona les teves joies i productes</p>
    </div>
    @if (!isBotiga()) {
      <button type="button" class="btn-primary" (click)="router.navigate(['/articles/new'])">
        <i class="pi pi-plus" aria-hidden="true"></i>
        <span>Afegir Article</span>
      </button>
    }
  </div>

  <div class="search-section">
    <div class="search-box">
      <i class="pi pi-search"></i>
      <input
        type="text"
        placeholder="Cercar per referència..."
        [(ngModel)]="searchOwnRef"
        (keyup.enter)="search()"
        class="search-input"
      />
    </div>
    <div class="search-actions">
      <button class="btn-search" (click)="search()">
        <i class="pi pi-search"></i>
        Cercar
      </button>
      <button class="btn-clear" (click)="clearSearch()">
        <i class="pi pi-times"></i>
        Netejar
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="loading-state">
      <i class="pi pi-spin pi-spinner text-brand-primary" style="font-size: 2rem"></i>
      <p>Carregant articles...</p>
    </div>
  } @else if (articles().length === 0) {
    <app-empty-state
      icon="pi pi-sparkles"
      title="No hi ha articles"
      description="Comença afegint el teu primer article"
      buttonText="Afegir Primer Article"
      [buttonRoute]="'/articles/new'"
    ></app-empty-state>
  } @else {
    <div class="article-grid" role="list">
      @for (article of articles(); track article.id) {
        <div class="article-grid-item" role="none">
          @if (!isBotiga()) {
            <div class="article-grid-actions">
              <button
                type="button"
                class="btn-icon"
                (click)="editArticle(article); $event.stopPropagation()"
                title="Editar"
                [attr.aria-label]="'Editar ' + article.name"
              >
                <i class="pi pi-pencil" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="btn-icon btn-danger"
                (click)="confirmDelete(article); $event.stopPropagation()"
                title="Eliminar"
                [attr.aria-label]="'Eliminar ' + article.name"
              >
                <i class="pi pi-trash" aria-hidden="true"></i>
              </button>
            </div>
          }
          <button
            type="button"
            class="article-grid-card article-grid-card--photo-only"
            role="listitem"
            (click)="viewArticle(article)"
            [attr.aria-label]="article.name"
          >
            @if (getArticlePhotoPath(article); as photoPath) {
              <img
                [src]="photoPath | assetUrl"
                [alt]="article.name"
                class="article-grid-photo"
                loading="lazy"
              />
            } @else {
              <span class="article-grid-photo article-grid-photo--name-fallback">
                {{ article.name }}
              </span>
            }
          </button>
        </div>
      }
    </div>
  }
</div>

<p-confirmDialog></p-confirmDialog>
